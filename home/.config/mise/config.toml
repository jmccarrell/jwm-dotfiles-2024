# mise global configuration — https://mise.jdx.dev/configuration.html
#
# Shared by both macs. Machine-specific tool versions do NOT belong here: mise also
# reads ~/.config/mise/conf.d/*.toml and merges it per-key, so a tool only one mac
# wants goes in an untracked file there. This mac runs terraform; the other uses brew
# opentofu and has never had it. That seam needs ~/.config/mise to be a real
# directory rather than a folded symlink, which `just status` checks.
#
# This file WINS over ~/.tool-versions. A *project* .tool-versions still wins over
# this, which is what you want. Move ~/.tool-versions aside anyway when migrating off
# asdf: it is dead weight that silently becomes authoritative the moment a tool is
# dropped from [tools] below.
#
# `mise use -g` and `mise settings set` write to this path, which is a stow symlink,
# so they edit the repo working tree in place. Also true of starship.toml, but mise
# is the one with a first-class CLI for mutating its own config.
#
# TRUST: nothing to configure, and nothing to be careful about. mise walks up from
# cwd looking for <dir>/.config/mise/config.toml. Under home/ no checkout of this
# repo has that path, so this file is only ever reached as the global config, which
# is trusted implicitly -- `just install` is safe from the main checkout or any
# worktree.
#
# That was not free before the home/ move. The file sat at the checkout root, so
# every worktree carried one and mise found it as a *project* config, where being
# untrusted is a hard error. Trust sharing runs main checkout -> linked worktrees and
# not the reverse (`mise trust --help`), so a global symlinked out of a worktree left
# the main checkout and every other worktree erroring. Same matrix, only the symlink
# source differing:
#
#   old layout, global <- main       all OK      new layout, global <- main      all OK
#   old layout, global <- worktree   main and    new layout, global <- worktree  all OK
#                                    peers fail

[settings]
# uv owns python, as of #35. Without this, mise would claim the python entries in
# .tool-versions files across ~/code -- 6 of them, pinning four different versions --
# and reintroduce a second interpreter manager days after we removed the first. Those
# pins have always been inert, because asdf never had a python plugin; mise ships it
# as a core tool and would honour them immediately.
#
# The .python-version files are unaffected either way: idiomatic version files are
# opt-in and off (idiomatic_version_file_enable_tools = []).
#
# This stays here rather than becoming MISE_DISABLE_TOOLS, which mise would ignore in
# any context lacking the var. Sole ownership of python has to hold everywhere, not
# only in shells that sourced something.
disable_tools = ["python"]

[tools]
# `lts` rather than a pinned patch, matching the `nodejs lts` this replaces. mise
# records the alias, not the resolution -- `mise use -g --pin` freezes a version if
# that is ever wanted.
#
# Shared deliberately: both macs want one node policy. terraform is the tool that
# differs, and it lives in conf.d.
node = "lts"
